<h1>プライバシーポリシー（yukkuri-rclone）</h1>
<p>このアプリは、作者本人が自分の Google ドライブに動画ファイルを保存するためだけに使う、個人用のツールです。</p>
<p>アクセスする範囲は、このアプリ自身が作成したファイル（<code>drive.file</code>）に限られます。第三者のデータは扱わず、取得した情報を外部に送信・共有・販売することはありません。</p>
<p>利用規約も同じです。本アプリは作者本人以外の利用を想定していません。</p>
<p>連絡先：<a href="https://github.com/2daime-same">https://github.com/2daime-same</a></p>
